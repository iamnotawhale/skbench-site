<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>skterm — Linux SSH workbench</title>
    <meta
      name="description"
      content="skterm is a Linux SSH client with hosts, split panes, SFTP, encrypted catalog, and optional cloud sync. Download the latest .deb."
    />
    <meta name="theme-color" content="#07090d" />
    <link rel="icon" href="assets/mark.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Sora:wght@400;500;600;700;800&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="stage" aria-hidden="true">
      <div class="glow glow-a"></div>
      <div class="glow glow-b"></div>
      <div class="grain"></div>
    </div>

    <main class="shell">
      <header class="brand-block">
        <p class="brand" aria-label="skterm">
          <span class="prompt-host">skterm</span
          ><span class="caret" aria-hidden="true"></span>
        </p>
        <h1>SSH workbench for Linux</h1>
        <p class="lede">
          Hosts, credentials, split panes, SFTP,<br />
          and an encrypted catalog —<br />
          with optional end-to-end cloud sync.
        </p>
      </header>

      <div class="actions">
        <a
          id="download"
          class="btn"
          href="https://github.com/iamnotawhale/skterm-site/releases/latest/download/skterm_amd64.deb"
        >
          <span class="btn-label">Download for Linux</span>
          <span id="version" class="btn-ver">…</span>
        </a>
        <p class="install">
          <span class="install-label">install</span>
          <code>sudo apt install ./skterm_amd64.deb</code>
        </p>
      </div>
    </main>

    <footer>
      <span>Debian / Ubuntu · amd64</span>
      <span aria-hidden="true">·</span>
      <span>Public installers only — source stays private</span>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
