<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>skterm — Linux SSH workbench</title>
    <meta
      name="description"
      content="skterm is a Linux SSH client with hosts, split panes, SFTP, encrypted catalog, and optional cloud sync. Download the latest .deb."
    />
    <meta name="theme-color" content="#07090d" />
    <link rel="icon" href="assets/mark.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Sora:wght@400;500;600;700;800&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="stage" aria-hidden="true">
      <div class="glow glow-a"></div>
      <div class="glow glow-b"></div>
      <svg class="watermark" viewBox="0 0 128 128" fill="none">
        <g fill="currentColor" transform="translate(8 22) scale(0.11)">
          <path
            d="m 199.06132,438.31428 15.68056,31.9823 c 9.98266,20.36192 14.97381,30.54078 14.97381,41.70306 0,11.16229 -4.99115,21.34115 -14.97345,41.70307 h -3.6e-4 L 199.06132,585.685 c -44.65064,91.0718 -66.97595,136.6119 -49.56643,159.19283 17.40954,22.58093 58.63503,1.55919 141.08602,-40.48429 L 516.86912,589.00511 c 64.74217,-33.01195 97.11145,-49.52002 97.11145,-77.00547 0,-27.48544 -32.36928,-43.99352 -97.11145,-77.00547 L 290.58127,319.60575 c -82.45099,-42.04307 -123.67684,-63.06481 -141.08638,-40.48304 -17.40952,22.58177 4.91579,68.11809 49.56643,159.19157 z"
          />
          <rect width="250" height="86.059822" x="614.5" y="667.69019" ry="70" rx="75" />
        </g>
      </svg>
      <div class="grain"></div>
    </div>

    <main class="shell">
      <header class="brand-block">
        <p class="brand" aria-label="skterm">
          <span class="prompt-host">skterm</span
          ><span class="caret" aria-hidden="true"></span>
        </p>
        <h1>SSH workbench for Linux</h1>
        <p class="lede">
          Hosts, credentials, split panes, SFTP, and an encrypted catalog — with optional
          end-to-end cloud sync.
        </p>
      </header>

      <div class="actions">
        <a
          id="download"
          class="btn"
          href="https://github.com/iamnotawhale/skterm-site/releases/latest/download/skterm_amd64.deb"
        >
          <span class="btn-label">Download for Linux</span>
          <span id="version" class="btn-ver">…</span>
        </a>
        <p class="install">
          <span class="install-label">install</span>
          <code>sudo apt install ./skterm_amd64.deb</code>
        </p>
      </div>
    </main>

    <footer>
      <span>Debian / Ubuntu · amd64</span>
      <span aria-hidden="true">·</span>
      <span>Public installers only — source stays private</span>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
